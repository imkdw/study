[project]
name = "rss-wiki"
version = "0.1.0"
description = "RSS 피드를 수집하고 본문을 요약해 마크다운 위키로 만드는 CLI 도구."
readme = "README.md"
authors = [
    { name = "imkdw", email = "imkdw@kakao.com" }
]
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "trafilatura>=2.2.0",
]

[project.scripts]
rss-wiki = "rss_wiki:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
